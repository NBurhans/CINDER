<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CINDER — Species Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#12211D;--ground2:#192E28;--ground3:#0C1815;
  --paper:#E8E2D2;--paper2:#DCD4C0;--ink:#16241F;
  --brass:#B0873C;--brass-lt:#D8AC5C;--verd:#589B84;--oxide:#A85440;
  --mute:#8A9A93;--line:rgba(232,226,210,.16);--line2:rgba(232,226,210,.3);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;margin:0}
p{margin:0 0 .9em}
a{color:var(--brass-lt);text-decoration:none}a:hover{text-decoration:underline}
button,select,input{font:inherit;font-family:var(--sans)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass-lt);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

.mast{border-bottom:1px solid var(--line);background:radial-gradient(1000px 380px at 10% -10%,rgba(88,155,132,.16),transparent 60%),linear-gradient(180deg,var(--ground3),var(--ground))}
.mast .wrap{padding:34px 20px 22px}
.mast h1{font-size:clamp(34px,5.5vw,58px);line-height:1;max-width:16ch}
.mast h1 em{font-style:italic;color:var(--brass-lt)}
.mast .sub{color:#C9D3CE;max-width:64ch;margin:10px 0 18px;font-size:15px}
.search{display:flex;gap:10px;align-items:center;max-width:720px}
.search input{flex:1;background:var(--paper);color:var(--ink);border:0;border-radius:6px;padding:12px 16px;font-size:18px;font-family:var(--serif)}
.search input::placeholder{color:#6E7873}
nav{position:sticky;top:0;z-index:20;background:rgba(18,33,29,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:12px;cursor:pointer;white-space:nowrap;font-size:15px}
nav button[aria-current=page]{color:var(--paper);border-bottom-color:var(--brass)}
main .wrap{padding:22px 20px 60px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{background:var(--ground2);color:var(--paper);border:1px solid var(--line2);border-radius:6px;padding:7px 10px}
.count{color:var(--mute);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.spec{background:var(--ground2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;gap:4px 10px;align-items:start}
.spec:hover{border-color:var(--line2)}
.spec .art{grid-row:1/4;width:56px;height:56px;image-rendering:pixelated;object-fit:contain;background:var(--ground3);border-radius:6px}
.spec .nm{font-family:var(--serif);font-size:22px;line-height:1.1}
.spec .nm small{font-family:var(--sans);font-size:12px;color:var(--mute);margin-left:6px}
.spec .tys{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.spec .mark{text-align:right}
.spec .no{color:var(--mute);font-size:12px}
.spec .cm{color:var(--brass-lt);font-weight:600;font-size:12px}
.ty{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45)}
.tier{display:inline-block;min-width:30px;text-align:center;border-radius:3px;padding:1px 6px;font-weight:700;font-size:13px;color:var(--ink)}
.tier.Sp{background:var(--brass-lt)}.tier.S{background:var(--verd)}.tier.A{background:#8DB7C9}
.tier.B{background:var(--paper2)}.tier.C{background:#9AA79F}.tier.D{background:#5E6C66;color:var(--paper)}
.tier.F{background:#3C4944;color:var(--mute)}.tier.NR{background:var(--ground3);color:var(--mute)}

.back{background:none;border:1px solid var(--line2);color:var(--paper);border-radius:6px;padding:6px 12px;cursor:pointer;margin-bottom:14px}
.doss h2{font-size:clamp(34px,5vw,54px);line-height:1}
.doss .hero{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.doss .art{width:128px;height:128px;image-rendering:pixelated;object-fit:contain;background:var(--ground3);border-radius:10px;border:1px solid var(--line);flex:none}
.doss .lead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0 4px;color:#C9D3CE}
.doss .lead .big{font-size:22px;color:var(--paper)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
h3{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--mute);margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.stat{display:grid;grid-template-columns:38px 40px 1fr;gap:10px;align-items:center;margin:3px 0}
.stat .bar{height:9px;background:var(--ground3);border-radius:3px;position:relative}
.stat .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--mute)}
.stat .bar i.hi{background:var(--verd)}.stat .bar i.lo{background:var(--oxide)}
.curve{width:100%;height:120px;display:block}
.mv{display:inline-block;padding:2px 8px;margin:2px 3px 2px 0;border-radius:3px;background:var(--ground3);font-size:13px;border-left:3px solid var(--line2)}
.mv.used{border:1px solid var(--brass-lt);border-left-width:3px;background:rgba(216,172,92,.12)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{color:var(--mute);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer}
th.n,td.n{text-align:right}th.no{cursor:default}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--ground2)}
.note{color:var(--mute);font-size:13px}
.warn{color:var(--brass-lt)}
.band{margin:18px 0 6px;padding:5px 10px;border-radius:4px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;background:var(--paper2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:3px 10px;border:1px solid var(--line2);border-radius:14px;background:var(--ground2);font-size:13px}
.empty{color:var(--mute);padding:40px 0;text-align:center;font-family:var(--serif);font-size:20px}
.rt{background:var(--ground2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.rt h4{margin:0 0 6px;font-family:var(--serif);font-size:20px;font-weight:400}
.rostart{width:40px;height:40px;image-rendering:pixelated;vertical-align:middle;margin-right:6px;object-fit:contain}
.tbl-scroll{overflow-x:auto}
.spark{display:flex;gap:2px;align-items:flex-end;height:30px}
.spark i{width:7px;background:var(--verd);display:block;border-radius:1px}
.spark i.neg{background:var(--oxide)}

.doss h4.sub2{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--paper2);margin:14px 0 6px}
.step{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ground2);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:16px 0}
.step button{background:var(--ground3);color:var(--paper);border:1px solid var(--line2);
  border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:17px;line-height:1}
.step button[disabled]{opacity:.35;cursor:default}
.step select{background:var(--ground3);color:var(--brass-lt);border:1px solid var(--brass);
  border-radius:6px;padding:7px 10px;font-weight:600;max-width:60vw}
.radar{width:100%;max-width:320px;height:auto;display:block;margin:6px auto 0}
.curve2{width:100%;height:160px;display:block}
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
@media(max-width:520px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tc{border:1px solid var(--line);border-top-width:3px;border-radius:4px;padding:5px 2px;
  text-align:center;font-size:12px;color:var(--mute)}
.tc b{font-weight:700}
.tc.bad{color:var(--oxide)}.tc.good{color:var(--verd)}.tc.nil{color:var(--brass-lt)}
.mv b{font-weight:400;color:var(--mute);font-size:11px;margin-left:6px}
.mv u{display:block;text-decoration:none;color:var(--brass-lt);font-size:11px}
.mv.flo{outline:1px dashed var(--brass);outline-offset:1px}
.mv.dim{opacity:.42}
.fit{margin:5px 0}
tr.on td{color:var(--brass-lt)}
tr.dimrow td{opacity:.5}
.doss .lead .note{font-size:13px}
</style></head>
<body>
<header class="mast"><div class="wrap">
<h1>A survey of <em>every</em> species, scored against the fights that matter.</h1>
<p class="sub">All 1,343 forms rated by role at each of eighteen checkpoints, from 2,698,734
damage-calculated matchups. Items and natures are chosen by measurement, not by rank.</p>
<div class="search"><input id="q" type="search" placeholder="Search a species, a route, a boss" aria-label="Search"></div>
</div></header>
<nav><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="main">Loading…</div></main>

<script id="payload" type="application/octet-stream">__PAYLOAD__</script>
<script id="sprites" type="application/octet-stream">__SPRITES__</script>
<script>
"use strict";
var D=null, SPR={}, best={}, view=null;
var St={tab:'dex',role:null,cp:9,tier:'all',type:'all',q:'',sort:4,dir:-1,rcp:9,avail:'all',dcp:9};
var SP={NAME:0,DEX:1,T1:2,T2:3,HP:4,ATK:5,DEF:6,SPA:7,SPD:8,SPE:9,BST:10,A1:11,A2:12,AH:13,
        GATE:14,GBASIS:15,FROM:16,INTO:17,EVO:18,LIN:19,SPR:20,STARTER:21,MISS:22,ONE:23,EGG:24,FORM:25};
var V={CP:0,SP:1,ROLE:2,TIER:3,VORP:4,FIT:5,S:6,T:7,Y:8,F:9,CEIL:10,FLOOR:11,ROI:12,ITEM:13,
       NAT:14,MOVES:15,SUS:16,TEAM:17,SAFE:18,SETUP:19,IDEP:20,TRACK:21,
       ABIL:22,EVS:23,REPL:24,SDEP:25,TRSN:26};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(v){return v==null?'\u2014':(+v).toFixed(3);}
function f2(v){return v==null?'\u2014':(+v).toFixed(2);}
function art(i){return SPR[i]||'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';}
function roleName(r){return String(r).replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});}
function tierPill(t){return '<span class="tier '+(t==='S+'?'Sp':t)+'">'+esc(t)+'</span>';}
function tyPill(i){if(i==null||i<0)return '';
  return '<span class="ty" style="background:'+D.meta.typecolors[i]+'">'+esc(D.meta.types[i])+'</span>';}
function cpName(c){for(var i=0;i<D.meta.cps.length;i++)if(D.meta.cps[i][0]===c)return D.meta.cps[i][1];return '?';}
function cpCap(c){for(var i=0;i<D.meta.cps.length;i++)if(D.meta.cps[i][0]===c)return D.meta.cps[i][2];return 0;}
function sel(key,opts,cur){
  var h='<select data-k="'+key+'">';
  for(var i=0;i<opts.length;i++)h+='<option value="'+esc(opts[i][0])+'"'+
    (String(opts[i][0])===String(cur)?' selected':'')+'>'+esc(opts[i][1])+'</option>';
  return h+'</select>';}
function cpOpts(all){var o=all?[['all','Every checkpoint']]:[];
  for(var i=0;i<D.meta.cps.length;i++)o.push([D.meta.cps[i][0],D.meta.cps[i][1]+' \u00b7 cap '+D.meta.cps[i][2]]);
  return o;}

var TABS=[['dex','Dex'],['rank','Rankings'],['roles','Roles'],['teams','Teams'],
          ['starters','Starters'],['boss','Bosses'],['routes','Routes'],['about','About']];

/* ---------- dex ---------- */
function specCard(si,r){
  var s=D.species[si];
  return '<div class="spec" tabindex="0" data-sp="'+si+'">'+
    '<img class="art" loading="lazy" alt="" src="'+art(s[SP.SPR])+'">'+
    '<div class="nm">'+esc(s[SP.NAME])+'<small>'+s[SP.BST]+'</small></div>'+
    '<div class="mark">'+(r?tierPill(D.meta.tiers[r[V.TIER]]):'<span class="no">\u2014</span>')+
      (s[SP.MISS]?'<div class="cm">one-time</div>':'')+'</div>'+
    '<div class="tys">'+tyPill(s[SP.T1])+tyPill(s[SP.T2])+'</div>'+
    '<div class="no" style="grid-column:1/-1">'+
      (r?esc(roleName(D.meta.roles[r[V.ROLE]]))+' \u00b7 VORP '+fmt(r[V.VORP])+
         (s[SP.GATE]!==''?' \u00b7 caught by '+cpName(s[SP.GATE]):'')
       :'not scored here')+'</div></div>';}

function rowsAt(cp){var o=[];for(var i=0;i<D.val.length;i++)if(D.val[i][V.CP]===cp)o.push(D.val[i]);return o;}
function bestAt(cp){var m={},r,i;var a=rowsAt(cp);
  for(i=0;i<a.length;i++){r=a[i];if(!m[r[V.SP]]||r[V.FIT]>m[r[V.SP]][V.FIT])m[r[V.SP]]=r;}return m;}

function viewDex(){
  var cp=+St.cp, bm=bestAt(cp), keys=Object.keys(bm), out=[];
  for(var i=0;i<keys.length;i++){
    var si=+keys[i], s=D.species[si], r=bm[si];
    if(St.tier!=='all'&&D.meta.tiers[r[V.TIER]]!==St.tier)continue;
    if(St.type!=='all'&&D.meta.types[s[SP.T1]]!==St.type&&D.meta.types[s[SP.T2]]!==St.type)continue;
    if(St.q&&s[SP.NAME].toLowerCase().indexOf(St.q.toLowerCase())<0)continue;
    out.push(r);}
  out.sort(function(a,b){return b[V.VORP]-a[V.VORP];});
  var types=D.meta.types.slice().sort();
  var h='<div class="filters">'+sel('cp',cpOpts(false),cp)+
    sel('tier',[['all','Every tier']].concat(D.meta.tiers.map(function(t){return [t,'Tier '+t];})),St.tier)+
    sel('type',[['all','Every type']].concat(types.map(function(t){return [t,t];})),St.type)+
    '<span class="count">'+out.length.toLocaleString()+' forms obtainable</span></div>';
  if(!out.length)return h+'<div class="empty">Nothing matches that filter.</div>';
  h+='<div class="grid">';
  for(var k=0;k<Math.min(out.length,240);k++)h+=specCard(out[k][V.SP],out[k]);
  h+='</div>';
  if(out.length>240)h+='<p class="note">Showing the strongest 240. Narrow with a filter or the search box.</p>';
  return h;}

/* ---------- rankings ---------- */
function viewRank(){
  var role=St.role||D.meta.roles[0], rows=[];
  for(var i=0;i<D.val.length;i++){var r=D.val[i];
    if(D.meta.roles[r[V.ROLE]]!==role)continue;
    if(St.cp!=='all'&&r[V.CP]!==+St.cp)continue;
    if(St.q&&D.species[r[V.SP]][SP.NAME].toLowerCase().indexOf(St.q.toLowerCase())<0)continue;
    rows.push(r);}
  var sk=St.sort,dr=St.dir;
  rows.sort(function(a,b){var x=a[sk],y=b[sk];if(x==null)x=-99;if(y==null)y=-99;return (y-x)*(dr<0?1:-1);});
  var h='<div class="filters">'+
    sel('role',D.meta.roles.map(function(r){return [r,roleName(r)];}),role)+
    sel('cp',[['all','Every checkpoint']].concat(cpOpts(false)),St.cp)+
    '<span class="count">'+rows.length.toLocaleString()+' scored builds</span></div>';
  if(!rows.length)return h+'<div class="empty">No builds pass this role\u2019s gates here.</div>';
  h+='<p class="note">Sorted on value over replacement. Replacement is the third-best '+
     'zero-investment build for the same role at the same checkpoint.</p>';
  h+='<div class="tbl-scroll"><table><thead><tr><th class="no">Species</th>'+
     '<th data-s="'+V.CP+'" class="n">Fight</th><th class="no">Tier</th>'+
     '<th data-s="'+V.VORP+'" class="n">VORP</th><th data-s="'+V.CEIL+'" class="n">Ceiling</th>'+
     '<th data-s="'+V.FLOOR+'" class="n">Floor</th><th data-s="'+V.ROI+'" class="n">ROI</th>'+
     '<th data-s="'+V.SUS+'" class="n">Sustain</th><th data-s="'+V.TEAM+'" class="n">Team</th>'+
     '<th class="no">Nature</th><th class="no">Item</th><th class="no">Moves</th></tr></thead><tbody>';
  for(var i=0;i<Math.min(rows.length,300);i++){var r=rows[i],s=D.species[r[V.SP]];
    h+='<tr class="clk" data-sp="'+r[V.SP]+'"><td>'+esc(s[SP.NAME])+'</td>'+
       '<td class="n">'+esc(cpName(r[V.CP]))+'</td>'+
       '<td>'+tierPill(D.meta.tiers[r[V.TIER]])+'</td>'+
       '<td class="n">'+fmt(r[V.VORP])+'</td><td class="n">'+f2(r[V.CEIL])+'</td>'+
       '<td class="n">'+f2(r[V.FLOOR])+'</td><td class="n">'+f2(r[V.ROI])+'</td>'+
       '<td class="n">'+(r[V.SUS]==null?'\u2014':r[V.SUS])+'</td>'+
       '<td class="n">'+(r[V.TEAM]?f2(r[V.TEAM]):'\u2014')+'</td>'+
       '<td>'+esc(D.meta.natures[r[V.NAT]])+'</td>'+
       '<td>'+esc(D.meta.items[r[V.ITEM]])+(r[V.IDEP]>0?' <span class="warn">scarce</span>':'')+'</td>'+
       '<td class="note">'+r[V.MOVES].map(function(m){return esc(D.meta.moves[m]);}).join(', ')+'</td></tr>';}
  return h+'</tbody></table></div>';}

/* ---------- roles ---------- */
function viewRoles(){
  var cp=+St.rcp;
  var h='<div class="filters">'+sel('rcp',cpOpts(false),cp)+
        '<span class="count">leaders by role, level cap '+cpCap(cp)+'</span></div>', any=false;
  for(var i=0;i<D.meta.roles.length;i++){
    var role=D.meta.roles[i], rows=[];
    for(var j=0;j<D.val.length;j++){var r=D.val[j];
      if(r[V.ROLE]===i&&r[V.CP]===cp)rows.push(r);}
    if(!rows.length)continue;
    any=true;
    rows.sort(function(a,b){return b[V.VORP]-a[V.VORP];});
    h+='<div class="band">'+esc(roleName(role))+'<span>'+rows.length+' pass the gates</span></div><div class="grid">';
    for(var k=0;k<Math.min(rows.length,6);k++)h+=specCard(rows[k][V.SP],rows[k]);
    h+='</div>';}
  return any?h:h+'<div class="empty">No roles scored at that checkpoint.</div>';}

/* ---------- teams ---------- */
function viewTeams(){
  var h='<p class="note">The strongest six drawn from each checkpoint\u2019s pool by beam search, '+
        'scored on coverage of that roster\u2019s threats weighted by how badly each unanswered one '+
        'loses. Every team is checked against literal item copy counts.</p>';
  for(var i=0;i<D.teams.length;i++){var t=D.teams[i];
    var mem=t[1].split(','), rl=t[2].split(','), it=t[3].split(',');
    h+='<div class="rt"><h4>'+esc(cpName(t[0]))+' <span class="note">covers '+t[4]+' of '+t[5]+
       ' roster slots \u00b7 level cap '+cpCap(t[0])+'</span></h4><div class="grid">';
    for(var j=0;j<mem.length;j++){
      var si=-1;for(var k=0;k<D.species.length;k++)if(D.species[k][SP.NAME]===mem[j]){si=k;break;}
      var s=si>=0?D.species[si]:null;
      h+='<div class="spec" tabindex="0" data-sp="'+si+'">'+
         '<img class="art" loading="lazy" alt="" src="'+art(s?s[SP.SPR]:-1)+'">'+
         '<div class="nm">'+esc(mem[j])+'</div><div class="mark"></div>'+
         '<div class="no" style="grid-column:1/-1">'+esc(roleName(rl[j]||''))+' \u00b7 '+
         esc(it[j]||'no item')+'</div></div>';}
    h+='</div></div>';}
  return h+'<p class="note">Coverage counts a threat as answered when one member beats it '+
    'one-on-one. That is a low bar, so read these as a ceiling rather than a promise.</p>';}

/* ---------- starters ---------- */
function viewStarters(){
  var b=D.starters[0];
  var h='<div class="rt"><h4>Open with '+esc(b[0])+'</h4><p class="note">Highest '+

     '<th class="no n">Line value</th><th class="no n">Dead-weight</th><th class="no">Comes online</th>'+

  for(var i=0;i<D.starters.length;i++){var s=D.starters[i], sp=D.species[s[1]];
    var spark='<div class="spark">';

/* ---------- routes ---------- */
function viewRoutes(){
  var cp=+St.cp, names=Object.keys(D.routes).sort(function(a,b){return D.routes[a].g-D.routes[b].g;});
  var h='<div class="filters">'+sel('cp',cpOpts(false),cp)+
        '<span class="count">read-only \u00b7 no run state</span></div>', n=0;
  for(var i=0;i<names.length;i++){
    var nm=names[i], rt=D.routes[nm];
    if(rt.g>cp)continue;
    if(St.q&&nm.toLowerCase().indexOf(St.q.toLowerCase())<0)continue;
    n++;
    var miss=0;for(var j=0;j<rt.e.length;j++)if(rt.e[j][6])miss++;
    h+='<div class="rt"><h4>'+esc(nm)+' <span class="note">opens at '+esc(cpName(rt.g))+
       ' \u00b7 '+rt.e.length+' encounters \u00b7 '+rt.i.length+' items'+
       (miss?' \u00b7 <span class="warn">'+miss+' one-time</span>':'')+'</span></h4>';
    if(rt.e.length){
      h+='<div class="tbl-scroll"><table><thead><tr><th class="no">Pokémon</th><th class="no">How</th>'+
         '<th class="no n">Rate</th><th class="no n">Levels</th><th class="no">Tier here</th></tr></thead><tbody>';
      var bm=bestAt(cp);
      for(var j=0;j<rt.e.length;j++){var e=rt.e[j], si=-1;
        for(var k=0;k<D.species.length;k++)if(D.species[k][SP.NAME]===e[0]){si=k;break;}
        var r=si>=0?bm[si]:null;
        h+='<tr'+(si>=0?' class="clk" data-sp="'+si+'"':'')+'><td>'+esc(e[0])+
           (e[6]?' <span class="cm">one-time</span>':'')+'</td><td class="note">'+esc(e[1])+
           (e[7]?' '+e[7]+'\u2605':'')+'</td><td class="n">'+(e[3]==='UNK'?'\u2014':e[3]+'%')+'</td>'+
           '<td class="n">'+(e[4]==='NA'?'\u2014':e[4]+'\u2013'+e[5])+'</td>'+
           '<td>'+(r?tierPill(D.meta.tiers[r[V.TIER]]):'<span class="no">\u2014</span>')+'</td></tr>';}
      h+='</tbody></table></div>';}
    if(rt.i.length){h+='<p class="note" style="margin-top:8px">Items: ';
      var parts=[];for(var j=0;j<rt.i.length;j++){var it=rt.i[j];
        parts.push(esc(it[0])+(it[3]?' ('+esc(it[3])+')':'')+
          (it[2]&&it[2]!=='1'&&it[2]!=='NA'?' \u00d7'+esc(it[2]):''));}
      h+=parts.join(' \u00b7 ')+'</p>';}

  return n?h:h+'<div class="empty">Nothing reachable yet at that checkpoint.</div>';}

/* ---------- about ---------- */
function viewAbout(){
  var h='<div class="cols"><div><h3>How a build is scored</h3>'+
    '<p>Roles first, gates before scores. A wall without recovery is not a wall at any bulk. '+
    'Every build is scored inside a role, never on one global ladder.</p>'+
    '<p class="note">role_fit = '+esc(D.meta.weights)+'. The utility family carries no stat term: '+
    'scoring a pivot on raw HP made the cell a base-stat ranking by construction.</p>'+
    '<h3>Floor, ceiling, VORP</h3>'+
    '<p>Floor is zero investment. Ceiling is the best build using only what is obtainable by that '+
    'checkpoint. VORP subtracts the third-best zero-investment build in the same role at the same '+
    'checkpoint. Both anchors were run through the damage engine \u2014 neither is a proxy.</p>'+
    '<h3>Items and natures are measured</h3>'+
    '<p>Each build\u2019s three candidate items are run against the roster and the winner is whichever '+
    'performs best. Measurement changed the pick on 16.2% of builds. Natures are enumerated the same '+
    'way; 18 distinct ones are chosen across the recommended set.</p>'+
    '<h3>Setup, priority, the Choice lock</h3>'+
    '<p>Setup moves generate their own variant, evaluated with boosts applied and gated on surviving '+
    'the setup turn \u2014 it wins on 9.6% of the builds offered both. Priority orders turns. Choice '+
    'items are scored under lock, one move across the whole roster.</p></div><div>'+
    '<h3>Invariants</h3><div class="tbl-scroll"><table><thead><tr><th class="no">Check</th>'+
    '<th class="no">Measures</th><th class="no n">Observed</th><th class="no n">Threshold</th>'+
    '<th class="no">Result</th></tr></thead><tbody>';
  for(var i=0;i<D.meta.invariants.length;i++){var v=D.meta.invariants[i];
    h+='<tr><td>'+esc(v[0])+'</td><td class="note">'+esc(v[1])+'</td><td class="n">'+esc(v[2])+
       '</td><td class="n">'+esc(v[3])+'</td><td>'+(v[4]==='pass'?'pass':
       '<span class="warn">'+esc(v[4])+'</span>')+'</td></tr>';}
  h+='</tbody></table></div><p class="note">A failing invariant blocks release until it is fixed or '+
     'overridden in writing, with the value, the reason and what would fix it. Three are overridden.</p>'+
     '<h3>What is not trustworthy</h3><dl class="kv">'+
     '<dt>Difficulty mode</dt><dd>Not encoded in the source. Every build here is mode-agnostic and '+
     'may hold an item that does not exist in the canonical mode. The largest open risk.</dd>'+
     '<dt>Team coverage</dt><dd>A threat counts as answered when one member beats it one-on-one, so '+
     'coverage reads full everywhere.</dd>'+
     '<dt>Hazards</dt><dd>Worth nothing in a one-on-one; their value is entirely about switching.</dd>'+
     '<dt>Opponent behaviour</dt><dd>The data carries no trainer AI flags, so the opponent never '+
     'switches. Modelling one would be invention.</dd>'+
     '<dt>Rates</dt><dd>Slot rates come from the published ladders, so they are Asserted while the '+
     'species and level band beside them are Measured.</dd>'+
     '<dt>Out of pool</dt><dd>157 forms have no reachable gate: breeding-only babies, code-redeemed '+
     'legendaries, and five the documentation lists as unobtainable.</dd></dl>'+
     '<h3>Provenance</h3><p class="note">Every damage figure is Derived: generation 9 mechanics are '+
     'pinned and the engine reproduced an independent implementation of the formula 12 times out of '+
     '12. Availability timing is Measured from the source\u2019s own gate index, not asserted from a '+
     'route order.</p></div></div>';
  return h;}

/* ---------- dossier ---------- */
function mvName(m){return D.meta.moves[m];}
function mvCol(m){var t=D.meta.mvtype[m];return t<0?'var(--line2)':D.meta.typecolors[t];}
function mvChip(m,lvl,cls,note){
  var p=D.meta.mvpow[m], meta=(p>0?p:'\u2014');
  if(lvl!=null)meta+=' \u00b7 L'+lvl;
  return '<span class="mv '+(cls||'')+'" style="border-left-color:'+mvCol(m)+'">'+
    esc(mvName(m))+'<b>'+meta+'</b>'+(note?'<u>'+esc(note)+'</u>':'')+'</span>';}

function radar(s){
  var st=[['HP',s[SP.HP]],['Atk',s[SP.ATK]],['Def',s[SP.DEF]],
          ['SpA',s[SP.SPA]],['SpD',s[SP.SPD]],['Spe',s[SP.SPE]]];
  var cx=150,cy=132,R=88,pts=[],ring=[],lbl='';
  for(var i=0;i<6;i++){
    var a=-Math.PI/2+i*Math.PI/3, r=R*Math.min(1,st[i][1]/180);
    pts.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1));
    ring.push((cx+Math.cos(a)*R).toFixed(1)+','+(cy+Math.sin(a)*R).toFixed(1));
    var lx=cx+Math.cos(a)*(R+22), ly=cy+Math.sin(a)*(R+22);
    lbl+='<text x="'+lx.toFixed(0)+'" y="'+(ly+4).toFixed(0)+'" text-anchor="'+
      (Math.abs(Math.cos(a))<.2?'middle':(Math.cos(a)>0?'start':'end'))+
      '" fill="#8A9A93" font-size="12">'+st[i][0]+' '+st[i][1]+'</text>';}
  return '<svg class="radar" viewBox="0 0 300 268" role="img" aria-label="Base stat shape">'+
    '<polygon points="'+ring.join(' ')+'" fill="none" stroke="rgba(232,226,210,.14)"/>'+
    '<polygon points="'+ring.map(function(p){var q=p.split(',');
      return (cx+(q[0]-cx)*.5).toFixed(1)+','+(cy+(q[1]-cy)*.5).toFixed(1);}).join(' ')+
      '" fill="none" stroke="rgba(232,226,210,.09)"/>'+
    '<polygon points="'+pts.join(' ')+'" fill="rgba(176,135,60,.42)" stroke="var(--brass-lt)" stroke-width="1.5"/>'+
    lbl+'</svg>';}

function curve(byc,cur){
  var cps=D.meta.cps,W=640,H=150,pad=26,n=cps.length;
  var x=function(i){return pad+i*(W-pad*2)/Math.max(1,n-1);};
  var y=function(v){return H-18-Math.max(0,Math.min(1,v))*(H-34);};
  var cl=[],fl=[],tick='',mark='';
  for(var i=0;i<n;i++){
    var c=cps[i][0],r=byc[c];
    if(r){cl.push(x(i)+','+y(r[V.CEIL]));
          if(r[V.FLOOR]!=null)fl.push(x(i)+','+y(r[V.FLOOR]));}
    tick+='<text x="'+x(i).toFixed(0)+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" fill="'+
      (c===cur?'var(--brass-lt)':'#6E7873')+'">'+(i+1)+'</text>';
    if(c===cur)mark='<line x1="'+x(i).toFixed(0)+'" y1="10" x2="'+x(i).toFixed(0)+'" y2="'+(H-16)+
      '" stroke="var(--brass)" stroke-dasharray="3 3"/>';}
  return '<svg class="curve2" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" '+
    'aria-label="Ceiling and floor value at every checkpoint">'+
    '<line x1="'+pad+'" y1="'+y(0)+'" x2="'+(W-pad)+'" y2="'+y(0)+'" stroke="rgba(232,226,210,.14)"/>'+
    '<line x1="'+pad+'" y1="'+y(1)+'" x2="'+(W-pad)+'" y2="'+y(1)+'" stroke="rgba(232,226,210,.14)"/>'+
    '<text x="4" y="'+(y(1)+4)+'" font-size="10" fill="#6E7873">1</text>'+
    '<text x="4" y="'+(y(.5)+4)+'" font-size="10" fill="#6E7873">0.5</text>'+
    '<text x="4" y="'+(y(0)+4)+'" font-size="10" fill="#6E7873">0</text>'+mark+
    (fl.length?'<polyline points="'+fl.join(' ')+'" fill="none" stroke="#8A9A93" stroke-width="1.6"/>':'')+
    (cl.length?'<polyline points="'+cl.join(' ')+'" fill="none" stroke="var(--paper)" stroke-width="2"/>':'')+
    tick+'</svg>';}

function typeGrid(s){
  var T=D.meta.types,C=D.meta.typechart,h='<div class="tgrid">';
  for(var a=0;a<T.length;a++){
    var x=C[a][s[SP.T1]];
    if(s[SP.T2]>=0)x*=C[a][s[SP.T2]];
    var cls=x>1?'bad':(x>0&&x<1?'good':(x===0?'nil':''));
    h+='<div class="tc '+cls+'" style="border-top-color:'+D.meta.typecolors[a]+'" '+
       'title="'+esc(T[a])+' \u00d7'+x+'">'+esc(T[a].slice(0,3))+
       (x===1?'':' <b>'+x+'</b>')+'</div>';}
  return h+'</div>';}

var EVOM={4:function(p,it){return 'level '+p;},
          7:function(p,it){return it?'use '+it:'use an item';},
          254:function(p,it){return 'Mega \u2014 '+(it||'stone');}};
function evoText(si){
  var e=D.evo&&D.evo[si]; if(!e||!e.length)return '';
  var out=[];
  for(var i=0;i<e.length;i++){
    var id=e[i][0],lab=EVOM[id]?EVOM[id](e[i][1],e[i][2]):
      (e[i][2]?'use '+e[i][2]:'special condition, source method '+id);
    out.push(esc(e[i][3])+' <span class="note">('+esc(lab)+')</span>');}
  return out.join(', ');}

function viewDoss(si){
  var s=D.species[si],i,rows=[];
  for(i=0;i<D.val.length;i++)if(D.val[i][V.SP]===si)rows.push(D.val[i]);
  var cps=D.meta.cps, cur=+St.dcp;
  if(!cps.some(function(c){return c[0]===cur;}))cur=cps[0][0];

  /* best row per checkpoint, and the row shown for the selected checkpoint */
  var byc={},best=null;
  for(i=0;i<rows.length;i++){var r=rows[i],c=r[V.CP];
    if(!byc[c]||r[V.FIT]>byc[c][V.FIT])byc[c]=r;
    if(!best||r[V.FIT]>best[V.FIT])best=r;}
  var here=byc[cur]||null;
  var here_all=rows.filter(function(r){return r[V.CP]===cur;})
                   .sort(function(a,b){return b[V.FIT]-a[V.FIT];});
  var ks=Object.keys(byc).map(Number).sort(function(a,b){return a-b;});
  var mc=0,mf=0,mv=0;
  for(i=0;i<ks.length;i++){var q=byc[ks[i]];mc+=q[V.CEIL];mf+=q[V.FLOOR]||0;mv+=q[V.VORP];}
  if(ks.length){mc/=ks.length;mf/=ks.length;mv/=ks.length;}
  var cap=cpCap(cur),obt=0;
  for(i=0;i<D.species.length;i++)if(D.species[i][SP.GATE]!==''&&D.species[i][SP.GATE]<=cur)obt++;

  var h='<button class="back" data-back="1">\u2190 Back to the survey</button><div class="doss">';

  /* --- masthead --- */
  h+='<p class="note" style="margin:0 0 6px">#'+String(s[SP.DEX]).padStart(3,'0')+' \u00b7 '+
     esc(s[SP.FORM])+'</p>';
  h+='<div class="hero"><img class="art" alt="" src="'+art(s[SP.SPR])+'"><div>'+
     '<h2>'+esc(s[SP.NAME])+'</h2><div class="lead">'+tyPill(s[SP.T1])+tyPill(s[SP.T2])+
     (best?tierPill(D.meta.tiers[best[V.TIER]]):'')+
     '<span class="big">'+fmt(mc)+'</span><span class="note">mean ceiling</span>'+
     '<span class="big">BST '+s[SP.BST]+'</span></div></div></div>';

  /* --- checkpoint stepper --- */
  var pos=cps.map(function(c){return c[0];}).indexOf(cur);
  h+='<div class="step"><span class="note">Show this species at</span>'+
     '<button data-dcp="'+(pos>0?cps[pos-1][0]:cur)+'"'+(pos<=0?' disabled':'')+'>\u2039</button>'+
     sel('dcp',cpOpts(false),cur)+
     '<button data-dcp="'+(pos<cps.length-1?cps[pos+1][0]:cur)+'"'+
       (pos>=cps.length-1?' disabled':'')+'>\u203a</button>'+
     '<span class="note">cap '+cap+', '+obt+' forms obtainable</span></div>';

  h+='<div class="cols">';

  /* --- left column: what it is --- */
  h+='<div>'+radar(s)+'<h3>Abilities</h3><p>'+
     esc(D.meta.abilities[s[SP.A1]])+
     (s[SP.A2]>=0?' \u00b7 '+esc(D.meta.abilities[s[SP.A2]]):'')+
     (s[SP.AH]>=0?' \u00b7 <span class="note">hidden</span> '+esc(D.meta.abilities[s[SP.AH]]):'')+
     '</p>';
  h+='<h3>Base stats</h3>';
  var st=[['HP',s[SP.HP]],['Atk',s[SP.ATK]],['Def',s[SP.DEF]],
          ['SpA',s[SP.SPA]],['SpD',s[SP.SPD]],['Spe',s[SP.SPE]]];
  for(i=0;i<st.length;i++){var v=st[i][1],cls=v>=110?'hi':(v<=55?'lo':'');
    h+='<div class="stat"><span class="note">'+st[i][0]+'</span><b>'+v+'</b>'+
       '<span class="bar"><i class="'+cls+'" style="width:'+Math.min(100,v/200*100)+'%"></i></span></div>';}
  h+='<h3>Damage taken by attacking type</h3>'+typeGrid(s)+
     '<p class="note">Read from the hack\u2019s own matchup arrays, not a vanilla chart.</p>';

  h+='<h3>Line</h3><p>';
  var line=[];
  for(i=0;i<D.species.length;i++)if(D.species[i][SP.LIN]===s[SP.LIN])line.push(i);
  line.sort(function(a,b){return D.species[a][SP.DEX]-D.species[b][SP.DEX];});
  h+=line.map(function(j){return j===si?'<b>'+esc(D.species[j][SP.NAME])+'</b>':
     '<a href="#" data-sp="'+j+'">'+esc(D.species[j][SP.NAME])+'</a>';}).join(' \u2192 ')||'\u2014';
  h+='</p>';
  var et=evoText(String(si));
  h+='<p class="note">'+(s[SP.FROM]?'Evolves from '+esc(s[SP.FROM])+'. ':'')+
     (et?'Evolves into '+et+'.':(s[SP.INTO]?'Evolves into '+esc(s[SP.INTO])+'.':'Does not evolve.'))+'</p>';
  var lg=D.lineage&&D.lineage[s[SP.LIN]];
  if(lg)h+='<dl class="kv"><dt>Lineage value</dt><dd>'+fmt(lg[2])+
     ' <span class="note">raw '+fmt(lg[0])+' less a dead-weight penalty of '+fmt(lg[1])+
     ', over '+lg[5]+' checkpoints</span></dd>'+
     '<dt>Comes online</dt><dd>'+(lg[3]==='never'?'never':esc(cpName(+lg[3])))+'</dd>'+
     '<dt>Forms scored</dt><dd class="note">'+esc(lg[4])+'</dd></dl>';
  h+='</div>';

  /* --- right column: what it is worth --- */
  h+='<div><h3>Performance</h3>'+curve(byc,cur)+
     '<p class="note">Pale line: ceiling value. Grey: floor. The dashed rule is the checkpoint '+
     'set above. Numbers along the foot are checkpoints in progression order.</p>';

  if(here){
    h+='<h3>At '+esc(cpName(cur))+'</h3><dl class="kv">'+
      '<dt>Ceiling / floor</dt><dd><b>'+f2(here[V.CEIL])+'</b> \u00b7 '+f2(here[V.FLOOR])+'</dd>'+
      '<dt>Value over replacement</dt><dd><b>'+fmt(here[V.VORP])+'</b></dd>'+
      '<dt>Role</dt><dd>'+esc(roleName(D.meta.roles[here[V.ROLE]]))+'</dd>'+
      '<dt>Item</dt><dd>'+esc(D.meta.items[here[V.ITEM]])+
        (here[V.IDEP]>0?' <span class="warn">scarce \u2014 falling back costs '+fmt(here[V.IDEP])+
         ' of margin</span>':' <span class="note">reliably obtainable</span>')+'</dd>'+
      '<dt>Track</dt><dd>'+esc(String(here[V.TRACK]).replace(/_/g,' '))+
        (here[V.SETUP]!==-1?' \u00b7 sets up with '+esc(D.meta.setups[here[V.SETUP]]):'')+
        (here[V.TRSN]>=0?' <span class="note">('+esc(D.meta.trackreasons[here[V.TRSN]])+')</span>':'')+'</dd>'+
      '<dt>Replacement here</dt><dd>'+fmt(here[V.REPL])+
        ' <span class="note">third-best floor in this role</span></dd>'+
      '<dt>Survives a switch-in</dt><dd>'+Math.round(here[V.SAFE]*100)+
        '% <span class="note">of this checkpoint\u2019s boss slots</span></dd>'+
      '<dt>Team contribution</dt><dd>'+(here[V.TEAM]?f2(here[V.TEAM]):
        '<span class="note">not in a recommended six</span>')+'</dd></dl>';

    h+='<h3>Across the run</h3><dl class="kv">'+
      '<dt>Mean ceiling / floor</dt><dd>'+fmt(mc)+' \u00b7 '+fmt(mf)+'</dd>'+
      '<dt>Mean VORP</dt><dd>'+fmt(mv)+(best?' \u2192 '+tierPill(D.meta.tiers[best[V.TIER]]):'')+'</dd>'+
      '<dt>ROI</dt><dd>'+(here[V.ROI]==null?'\u2014':f2(here[V.ROI])+
        ' <span class="note">margin gained by building it properly</span>')+'</dd>'+
      '<dt>Checkpoints scored</dt><dd>'+ks.length+' of '+cps.length+'</dd>'+
      '<dt>First obtainable</dt><dd>'+(s[SP.GATE]===''?'not reachable in this run':
        esc(cpName(s[SP.GATE]))+' <span class="note">('+esc(s[SP.GBASIS])+')</span>')+'</dd>'+
      (s[SP.ONE]?'<dt>One-time</dt><dd class="warn">yes \u2014 miss it and it is gone</dd>':'')+
      (s[SP.STARTER]?'<dt>Starter</dt><dd>yes \u00b7 also in the Celadon shard pool at gate 3</dd>':'')+
      '</dl>';

    h+='<h3>Sustain \u2014 how long it stays on the field</h3><dl class="kv">'+
      '<dt>Sweep depth</dt><dd>'+(here[V.SDEP]==null?'\u2014':'<b>'+here[V.SDEP]+
        '</b> boss slots on one lifebar <span class="note">(the bar resets each trainer)</span>')+'</dd>'+
      '<dt>Kit contribution</dt><dd>'+(here[V.SUS]==null?'\u2014':'<b>'+here[V.SUS]+
        '</b> <span class="note">this build minus the same species with no kit</span>')+'</dd></dl>'+
      '<p class="note">The axis is the kit delta, not raw depth: raw depth correlates 0.81 with BST '+
      'and measures size rather than kit. Simplified \u2014 no PP, no AI switching, no boss healing, '+
      'no crits.</p>';

    h+='<h3>Ceiling build at '+esc(cpName(cur))+'</h3><dl class="kv">'+
      '<dt>Nature</dt><dd>'+esc(D.meta.natures[here[V.NAT]])+'</dd>'+
      '<dt>EVs</dt><dd>'+(here[V.EVS]>=0?esc(D.meta.evspreads[here[V.EVS]]):'\u2014')+
        ', 31 IVs</dd>'+
      '<dt>Ability</dt><dd>'+(here[V.ABIL]>=0?esc(D.meta.abilities[here[V.ABIL]]):'\u2014')+'</dd>'+
      '<dt>Held item</dt><dd>'+esc(D.meta.items[here[V.ITEM]])+'</dd>'+
      '<dt>Moves</dt><dd>'+here[V.MOVES].map(function(m){return mvChip(m,null,'used');}).join('')+
      '</dd></dl>';

    h+='<h3>Role fits at this checkpoint</h3>';
    for(i=0;i<here_all.length;i++){var r3=here_all[i];
      h+='<div class="fit"><b>'+esc(roleName(D.meta.roles[r3[V.ROLE]]))+'</b> '+fmt(r3[V.FIT])+
         ' <span class="note">stat '+fmt(r3[V.S])+' \u00b7 tool '+fmt(r3[V.T])+
         ' \u00b7 type '+fmt(r3[V.Y])+' \u00b7 fight '+fmt(r3[V.F])+'</span></div>';}
    if(!here_all.length)h+='<p class="note">No role gate passed here.</p>';
  }else{
    h+='<h3>At '+esc(cpName(cur))+'</h3><p class="note">Not obtainable yet, or it passed no role '+
       'gate at this checkpoint. Step to another checkpoint above.</p>';}
  h+='</div></div>';

  /* --- every checkpoint --- */
  h+='<h3>Every checkpoint</h3><div class="tbl-scroll"><table><thead><tr>'+
     '<th class="no">#</th><th class="no">checkpoint</th><th class="no n">cap</th>'+
     '<th class="no">role</th><th class="no n">floor</th><th class="no n">ceiling</th>'+
     '<th class="no n">VORP</th><th class="no">item</th><th class="no">nature</th>'+
     '</tr></thead><tbody>';
  for(i=0;i<cps.length;i++){
    var c=cps[i][0],r4=byc[c];
    h+='<tr'+(c===cur?' class="on"':'')+'><td>'+(i+1)+'</td><td>'+esc(cps[i][1])+'</td>'+
       '<td class="n">'+cps[i][2]+'</td>'+
       (r4?'<td>'+esc(roleName(D.meta.roles[r4[V.ROLE]]))+'</td><td class="n">'+f2(r4[V.FLOOR])+
           '</td><td class="n">'+f2(r4[V.CEIL])+'</td><td class="n">'+fmt(r4[V.VORP])+'</td>'+
           '<td>'+esc(D.meta.items[r4[V.ITEM]])+'</td><td>'+esc(D.meta.natures[r4[V.NAT]])+'</td>'
         :'<td colspan="6" class="note">not scored here</td>')+'</tr>';}
  h+='</tbody></table></div>';

  /* --- movepool --- */
  var pool=D.pool[si]||[[],[],[],[]];
  var used={},fl={};
  if(here)for(i=0;i<here[V.MOVES].length;i++)used[here[V.MOVES][i]]=1;
  var fb=D.floor[cur+'_'+si];
  if(fb)for(i=0;i<fb[1].length;i++)fl[fb[1][i]]=1;
  function mvcls(m){return used[m]?'used':(fl[m]?'flo':'');}

  h+='<h3>Moves</h3><p class="note">'+
     '<span class="mv used" style="border-left-color:var(--line2)">outlined</span> '+
     'used by the ceiling build at this checkpoint \u00b7 '+
     '<span class="mv flo" style="border-left-color:var(--line2)">dashed</span> '+
     'used by the zero-investment floor. The left edge is the move\u2019s type; the small figures '+
     'are base power and, for level-up moves, the level it is learned at.</p>';

  var lvA=[],lvB=[];
  for(i=0;i<pool[0].length;i++)(pool[0][i][1]<=cap?lvA:lvB).push(pool[0][i]);
  h+='<h4 class="sub2">Level-up, learned by cap '+cap+'</h4><div>'+
     (lvA.map(function(p){return mvChip(p[0],p[1],mvcls(p[0]));}).join('')||'<span class="note">none</span>')+'</div>';
  if(lvB.length)h+='<h4 class="sub2">Level-up, after the cap</h4><div>'+
     lvB.map(function(p){return mvChip(p[0],p[1],mvcls(p[0])+' dim');}).join('')+'</div>';

  function gated(list,label){
    if(!list.length)return '<h4 class="sub2">'+label+'</h4><p class="note">none</p>';
    var o='<h4 class="sub2">'+label+'</h4><div>';
    for(var j=0;j<list.length;j++){
      var m=list[j][0],g=D.meta.mvgate[m];
      var no=(g<0)?'gate not recorded':(g>cur?'from '+cpName(g):null);
      o+=mvChip(m,null,mvcls(m)+((g<0||g>cur)?' dim':''),no);}
    return o+'</div>';}
  h+=gated(pool[1],'TMs \u2014 faded ones are not obtainable at this checkpoint');
  h+=gated(pool[2],'Tutor moves');
  if(pool[3].length)h+='<h4 class="sub2">Egg moves</h4><div>'+
     pool[3].map(function(m){return mvChip(m,null,mvcls(m));}).join('')+'</div>';

  /* --- where to get it --- */
  var av=(D.avail&&D.avail[si])||[];
  h+='<h3>Where to get it</h3>';
  if(av.length){
    h+='<div class="tbl-scroll"><table><thead><tr><th class="no">location</th>'+
       '<th class="no">method</th><th class="no">from</th><th class="no n">level</th>'+
       '<th class="no n">rate</th></tr></thead><tbody>';
    for(i=0;i<av.length;i++){var a=av[i];
      h+='<tr'+(a[2]!=null&&a[2]>cur?' class="dimrow"':'')+'><td>'+esc(D.meta.locs[a[0]])+'</td>'+
         '<td>'+esc(D.meta.methods[a[1]])+'</td>'+
         '<td>'+(a[2]==null?'<span class="note">UNK</span>':esc(cpName(a[2])))+'</td>'+
         '<td class="n">'+(a[3]==null?'\u2014':a[3]+(a[4]!==a[3]?'\u2013'+a[4]:''))+'</td>'+
         '<td class="n">'+(a[5]==null?'\u2014':a[5]+'%')+'</td>'+
         (a[6]?'<td class="warn">one-time</td>':'')+'</tr>';}
    h+='</tbody></table></div>';
  }else h+='<p class="note">No obtainment record in the world table \u2014 this form is either '+
     'evolution-only or not reachable in this run.</p>';

  h+='<p class="note" style="margin-top:18px">Every figure here is Derived: computed by the damage '+
     'engine from this hack\u2019s own species, move and item tables under generation 9 mechanics. '+
     esc(D.meta.cardlimits)+'</p>';
  return h+'</div>';}

/* ---------- shell ---------- */
function render(){
  var t=document.getElementById('tabs'),h='';
  for(var i=0;i<TABS.length;i++)h+='<button data-t="'+TABS[i][0]+'"'+
    (St.tab===TABS[i][0]&&view===null?' aria-current="page"':'')+'>'+TABS[i][1]+'</button>';
  t.innerHTML=h;
  var m=document.getElementById('main');
  if(view!==null){m.innerHTML=viewDoss(view);}
  else m.innerHTML={dex:viewDex,rank:viewRank,roles:viewRoles,teams:viewTeams,
    starters:viewStarters,boss:viewBoss,routes:viewRoutes,about:viewAbout}[St.tab]();
  window.scrollTo(0,0);}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-t]'); if(b){St.tab=b.getAttribute('data-t');view=null;render();return;}
  if(e.target.closest('[data-back]')){view=null;render();return;}
  var dc=e.target.closest('[data-dcp]');
  if(dc){e.preventDefault();St.dcp=+dc.getAttribute('data-dcp');render();return;}
  var sp=e.target.closest('[data-sp]');
  if(sp&&+sp.getAttribute('data-sp')>=0){e.preventDefault();
    if(view===null)St.dcp=(St.cp==='all'?D.meta.cps[0][0]:+St.cp);
    view=+sp.getAttribute('data-sp');render();return;}
  var th=e.target.closest('th[data-s]');
  if(th){var k=+th.getAttribute('data-s');St.dir=(St.sort===k)?-St.dir:-1;St.sort=k;render();}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){var sp=e.target.closest&&e.target.closest('[data-sp]');
    if(sp){view=+sp.getAttribute('data-sp');render();}}
  if(e.key==='Escape'&&view!==null){view=null;render();}});
document.addEventListener('change',function(e){
  var k=e.target.getAttribute&&e.target.getAttribute('data-k');
  if(!k)return; St[k]=(k==='dcp')?+e.target.value:e.target.value; render();});
document.getElementById('q').addEventListener('input',function(e){
  St.q=e.target.value; if(view!==null)view=null;
  if(St.tab!=='dex'&&St.tab!=='routes'&&St.tab!=='rank')St.tab='dex';
  render();});

function gunzip(b64){
  var bin=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0);});
  if(!('DecompressionStream' in window))return Promise.reject(new Error('DecompressionStream'));
  return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip')))
    .arrayBuffer().then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});}
gunzip(document.getElementById('payload').textContent.trim()).then(function(p){
  D=p; return gunzip(document.getElementById('sprites').textContent.trim());
}).then(function(s){
  for(var k in s)SPR[+k]=s[k];
  St.role=D.meta.roles[0];
  render();
}).catch(function(e){
  document.getElementById('main').innerHTML='<div class="empty">This page needs a browser with '+
    'DecompressionStream \u2014 Chrome 80+, Firefox 113+ or Safari 16.4+.<br><span class="note">'+
    esc(e.message)+'</span></div>';});
</script></body></html>
